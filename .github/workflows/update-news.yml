
name: Update Esports News

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest esports news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |

          mkdir -p data

          curl -sG "https://newsapi.org/v2/everything" \
            --data-urlencode 'q=("PUBG Mobile" OR BGMI OR PMWC OR "Esports World Cup" OR VALORANT OR "Dota 2" OR "Mobile Legends" OR "FC Mobile" OR "GTA esports")' \
            --data-urlencode 'language=en' \
            --data-urlencode 'sortBy=publishedAt' \
            --data-urlencode 'pageSize=30' \
            --data-urlencode "apiKey=${NEWS_API_KEY}" \
            -o data/news.json

      - name: Check news response
        run: |

          if grep -q '"status":"error"' data/news.json; then
            echo "NewsAPI returned an error:"
            cat data/news.json
            exit 1
          fi

          echo "News data successfully updated."

      - name: Commit updated news
        run: |

          git config user.name "EsportsPulse News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || \
          git commit -m "Update latest esports news"

          git push
